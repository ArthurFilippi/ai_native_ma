[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ainma"
version = "0.0.0"
description = "AI-native M&A: sourced answers, buy-side screening and KPI extraction with an honest evaluation harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
local-models = ["fastembed>=0.3"]
postgres = ["asyncpg>=0.29", "sqlalchemy[asyncio]>=2.0", "pgvector>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/ainma"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# contracts.py is a verbatim copy of the specification (str, Enum is intentional)
"src/ainma/contracts.py" = ["UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
